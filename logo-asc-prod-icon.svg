<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F08A1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E0F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фоновый круг -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0B5FA5" stroke-width="1.5" opacity="0.1"/>
  
  <!-- Шестеренка (иконка) -->
  <g id="gear-icon" filter="url(#glow)">
    <!-- Зубцы (12 штук) -->
    <g fill="url(#iconGradient)">
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(0 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(30 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(60 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(90 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(120 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(150 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(180 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(210 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(240 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(270 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(300 100 100)"/>
      <rect x="95" y="25" width="10" height="22" rx="3" transform="rotate(330 100 100)"/>
    </g>
    
    <!-- Основной круг шестеренки -->
    <circle cx="100" cy="100" r="55" fill="none" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Внутренний круг -->
    <circle cx="100" cy="100" r="32" fill="#0B5FA5" opacity="0.1"/>
    
    <!-- Центральный круг -->
    <circle cx="100" cy="100" r="25" fill="#0B5FA5"/>
    
    <!-- Внутренний акцент -->
    <circle cx="100" cy="100" r="15" fill="#F08A1E"/>
    
    <!-- Точка в центре -->
    <circle cx="100" cy="100" r="6" fill="#0B5FA5"/>
  </g>

  <!-- Декоративные элементы -->
  <!-- Верхняя точка (ASC акцент) -->
  <circle cx="100" cy="20" r="3" fill="#F08A1E" opacity="0.6"/>
  
  <!-- Боковые точки -->
  <circle cx="175" cy="100" r="3" fill="#F08A1E" opacity="0.4"/>
  <circle cx="25" cy="100" r="3" fill="#F08A1E" opacity="0.4"/>
  
  <!-- Нижняя точка -->
  <circle cx="100" cy="180" r="3" fill="#F08A1E" opacity="0.6"/>
</svg>